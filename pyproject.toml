[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-workbench"
version = "1.0.0"
description = "A small, reproducible CSV-to-SQLite analytics pipeline with explicit quality checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Okan Yakin" }]
dependencies = []

[project.scripts]
data-quality = "data_quality_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
